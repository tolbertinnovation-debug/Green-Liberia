name: Publish VGL Media website
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare public files
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp about.html _site/about.html
          cp partners.html _site/partners.html
          cp environmental-hour.html _site/environmental-hour.html
          cp styles.css _site/styles.css
          cp site.js _site/site.js
          cp "file_00000000d0188243baf20b9f515b8f73.png" _site/
          cp "PROFILE Voices for a Green Liberia.docx" _site/
          cp vgl-community-cleanup-1300.jpg _site/
          cp vgl-community-cleanup-800.jpg _site/
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
